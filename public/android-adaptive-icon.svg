<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Full-bleed Royal Blue background gradient from user's attached NSProperties logo -->
    <radialGradient id="royalBlueBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#0856f6"/>
      <stop offset="55%" stop-color="#0047e0"/>
      <stop offset="100%" stop-color="#0035b8"/>
    </radialGradient>

    <!-- Blue Architectural 3D Frame Gradients -->
    <linearGradient id="frameBevelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="frameWallBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f2b82"/>
    </linearGradient>

    <linearGradient id="estateRoad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Building Gradients -->
    <linearGradient id="buildingRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Lush Grass Courtyard Gradients -->
    <linearGradient id="parkGrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <linearGradient id="trackRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Drop Shadows for 3D realism -->
    <filter id="royalShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001859" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002b99" flood-opacity="0.5"/>
    </filter>

    <filter id="bldgShadowDrop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#00164e" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed background rectangle covering 100% of the 512x512 canvas (NO white border, NO padding) -->
  <rect width="512" height="512" fill="url(#royalBlueBg)"/>

  <!-- 
    THE MASTER 3D ARCHITECTURAL "4" ESTATE 
    Positioned and scaled precisely to fit within the Android Adaptive Icon Safe Zone (central 70% circle)
    Center of safe zone: (256, 256)
  -->
  <g filter="url(#royalShadow4)" transform="matrix(0.53 0 0 0.53 45 36)">

    <!-- 3D Extrusion Side Walls (Lower Depth) -->
    <path d="M 400 95 L 545 95 L 545 490 L 650 490 L 650 600 L 545 600 L 545 745 L 405 745 L 405 600 L 155 600 L 155 465 L 400 95 Z" 
          fill="url(#frameWallBlue)" transform="translate(0, 16)"/>

    <!-- Main Outer Blue Frame of the "4" -->
    <path d="M 400 95 L 545 95 L 545 490 L 650 490 L 650 600 L 545 600 L 545 745 L 405 745 L 405 600 L 155 600 L 155 465 L 400 95 Z" 
          fill="url(#frameBevelBlue)" stroke="#93c5fd" stroke-width="7" stroke-linejoin="round"/>

    <!-- Inner Triangular Cutout Wall & Base -->
    <path d="M 425 240 L 425 490 L 275 490 Z" 
          fill="#002277" stroke="#1d4ed8" stroke-width="8" stroke-linejoin="round"/>

    <!-- Internal Roadway / Ground Planes -->
    <path d="M 390 125 L 175 480 L 390 480 Z" fill="url(#estateRoad)" opacity="0.75"/>
    <rect x="425" y="115" width="100" height="610" fill="url(#estateRoad)" opacity="0.9"/>
    <rect x="175" y="505" width="455" height="75" fill="url(#estateRoad)" opacity="0.9"/>
    <rect x="425" y="505" width="100" height="220" fill="url(#estateRoad)" opacity="0.9"/>

    <!-- ============================================== -->
    <!-- LUXURY WHITE ARCHITECTURAL TOWERS & BUILDINGS -->
    <!-- ============================================== -->

    <!-- Tower 1: Top Right Vertical Tower (L-shaped luxury block) -->
    <g filter="url(#bldgShadowDrop)">
      <path d="M 445 120 L 525 120 L 525 230 L 485 230 L 485 160 L 445 160 Z" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="450" y="125" width="25" height="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="505" cy="140" r="6" fill="#0284c7"/>
      <rect x="495" y="165" width="20" height="55" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Tower 2: Upper Diagonal Building 1 -->
    <g filter="url(#bldgShadowDrop)" transform="rotate(-40, 390, 240)">
      <rect x="360" y="210" width="45" height="95" rx="3" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="368" y="220" width="28" height="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="368" y="250" width="28" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Tower 3: Mid Diagonal Building 2 -->
    <g filter="url(#bldgShadowDrop)" transform="rotate(-40, 310, 340)">
      <rect x="280" y="310" width="45" height="95" rx="3" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="288" y="320" width="28" height="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="288" y="360" width="28" height="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Tower 4: Lower Diagonal Building 3 -->
    <g filter="url(#bldgShadowDrop)" transform="rotate(-40, 230, 440)">
      <rect x="200" y="410" width="45" height="85" rx="3" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="208" y="420" width="28" height="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="208" y="455" width="28" height="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Tower 5: Mid Vertical Right Block -->
    <g filter="url(#bldgShadowDrop)">
      <rect x="490" y="330" width="38" height="130" rx="3" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="496" y="340" width="26" height="45" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <rect x="496" y="395" width="26" height="55" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Tower 6: Bottom Left Corner Block (L-shaped) -->
    <g filter="url(#bldgShadowDrop)">
      <path d="M 175 515 L 275 515 L 275 550 L 210 550 L 210 580 L 175 580 Z" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="185" y="522" width="75" height="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Tower 7: Horizontal Bottom Center Block -->
    <g filter="url(#bldgShadowDrop)">
      <rect x="295" y="520" width="105" height="45" rx="3" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="305" y="528" width="85" height="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Tower 8: Right Horizontal Block (Courtyard Enclosure) -->
    <g filter="url(#bldgShadowDrop)">
      <rect x="545" y="515" width="85" height="65" rx="3" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="565" y="530" width="45" height="35" rx="2" fill="url(#parkGrass)" stroke="#ca8a04" stroke-width="2"/>
      <circle cx="587" cy="547" r="8" fill="#38bdf8"/>
    </g>

    <!-- Tower 9: Lower Stem Central Tower -->
    <g filter="url(#bldgShadowDrop)">
      <rect x="455" y="555" width="35" height="75" rx="3" fill="url(#buildingRoof)" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="460" y="565" width="25" height="55" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- ============================================== -->
    <!-- GREEN LANDSCAPED COURTYARDS, PARKS & AMENITIES -->
    <!-- ============================================== -->

    <!-- Central Vertical Garden Boulevard with Oval Running Track -->
    <g>
      <rect x="445" y="270" width="32" height="200" rx="16" fill="url(#parkGrass)" stroke="#16a34a" stroke-width="2"/>
      <rect x="450" y="280" width="22" height="180" rx="11" fill="none" stroke="url(#trackRing)" stroke-width="3"/>
      <circle cx="461" cy="310" r="5" fill="#38bdf8"/>
      <circle cx="461" cy="370" r="5" fill="#38bdf8"/>
      <circle cx="461" cy="430" r="5" fill="#38bdf8"/>
    </g>

    <!-- Diagonal Linear Forest Buffer -->
    <g fill="#22c55e" stroke="#15803d" stroke-width="1">
      <circle cx="340" cy="470" r="6"/>
      <circle cx="355" cy="470" r="7"/>
      <circle cx="370" cy="470" r="6"/>
      <circle cx="385" cy="470" r="8"/>
      <circle cx="280" cy="470" r="7"/>
      <circle cx="295" cy="470" r="6"/>
      <circle cx="310" cy="470" r="7"/>

      <circle cx="395" cy="420" r="6"/>
      <circle cx="405" cy="390" r="7"/>
      <circle cx="410" cy="350" r="6"/>
      <circle cx="415" cy="300" r="7"/>

      <circle cx="488" cy="275" r="7"/>
      <circle cx="488" cy="300" r="6"/>
      <circle cx="488" cy="475" r="7"/>
      <circle cx="440" cy="485" r="7"/>
    </g>

    <!-- Lower Leg Roundabout & Promenade -->
    <g>
      <rect x="445" y="650" width="40" height="70" rx="20" fill="url(#parkGrass)" stroke="#16a34a" stroke-width="2"/>
      <circle cx="465" cy="670" r="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="465" cy="670" r="6" fill="#facc15"/>

      <circle cx="435" cy="650" r="6" fill="#22c55e"/>
      <circle cx="435" cy="680" r="7" fill="#15803d"/>
      <circle cx="435" cy="710" r="6" fill="#22c55e"/>
      <circle cx="495" cy="650" r="6" fill="#22c55e"/>
      <circle cx="495" cy="680" r="7" fill="#15803d"/>
      <circle cx="495" cy="710" r="6" fill="#22c55e"/>
    </g>
  </g>
</svg>
